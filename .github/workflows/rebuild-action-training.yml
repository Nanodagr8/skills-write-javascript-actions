name: Rebuild bundled Action (temporary branch-only lab)

on:
  push:
    branches: [fix-empty-joke-action-output]
    paths:
      - 'src/main.js'

permissions:
  contents: write

jobs:
  rebuild:
    if: github.repository == 'Nanodagr8/skills-write-javascript-actions'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Commit only the generated bundle if changed
        run: |
          if ! git diff --quiet -- dist/; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- dist/
            git diff --cached --check
            git commit -m 'build: synchronize bundled action after output validation'
            git push origin HEAD:fix-empty-joke-action-output
          fi
